<github-collections-filter />

<hr />
<br />

@for(config of tableConfigs | keyvalue; track config){
<div>
  <mat-card>
    <github-collection-table [label]="config.value.label" [type]="config.value.type"
      [columnDefs]="config.value.columnDefs" [rowData]="config.value.rowData" [pagination]="config.value.pagination"
      [dataLoading]="config.value.dataLoading"
      (paginationChanged)="onPaginationChanged($event)"></github-collection-table>
  </mat-card>
</div>
}
